<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComplyGraph — Market Access Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='%238F9EFF' d='M 228 0 C 172.772 0 128 44.772 128 100 L 128 0 L 0 0 L 0 28 C 0 83.228 44.772 128 100 128 L 0 128 L 0 256 L 28 256 C 83.228 256 128 211.228 128 156 L 128 256 L 256 256 L 256 228 C 256 172.772 211.228 128 156 128 L 256 128 L 256 0 Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ======== floating pill nav ======== -->
<nav class="pill-nav" id="pill-nav">
  <div class="pill-inner">
    <a class="brand" href="#top">
      <svg class="logo-clover" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
        <path d="M 228 0 C 172.772 0 128 44.772 128 100 L 128 0 L 0 0 L 0 28 C 0 83.228 44.772 128 100 128 L 0 128 L 0 256 L 28 256 C 83.228 256 128 211.228 128 156 L 128 256 L 256 256 L 256 228 C 256 172.772 211.228 128 156 128 L 256 128 L 256 0 Z"/>
      </svg>
      <span class="brand-name">ComplyGraph</span>
    </a>
    <div class="pill-links">
      <a href="#map-section" class="active" data-i18n="nav_map"></a>
      <a href="#reveal-section" data-i18n="nav_why"></a>
      <a href="#stats-section" data-i18n="nav_stats"></a>
    </div>
    <div class="pill-right">
      <div class="lang-toggle" id="lang-toggle">
        <button data-lang="en">EN</button><button data-lang="zh">中文</button>
      </div>
      <span class="chip subtle"><span data-i18n="as_of"></span>&nbsp;<span id="as-of-date"></span></span>
      <button id="chat-btn" class="btn cta"><span data-i18n="chat_btn"></span></button>
    </div>
  </div>
</nav>

<!-- ======== cosmic hero ======== -->
<header class="hero" id="top">
  <div class="hero-layer" id="hero-sky"><img src="/assets/sky.png" alt=""></div>
  <div class="hero-title-wrap" id="hero-title">
    <h1 class="gradient-title">ComplyGraph</h1>
  </div>
  <div class="hero-sub left" data-i18n="hero_sub_left"></div>
  <div class="hero-sub right" data-i18n="hero_sub_right"></div>
  <div class="hero-layer building" id="hero-building"><img src="/assets/building.png" alt=""></div>
  <div class="hero-cue"><span data-i18n="scroll_cue"></span><i></i></div>
</header>

<div class="mountain-wrap" id="mountain-wrap">
  <div class="mountain-bg"><img id="mountain-img" src="/assets/mountain.png" alt=""></div>
  <div class="mountain-content">

<main class="wrap" id="main">

  <!-- ======== market marquee ======== -->
  <section class="marquee-zone">
    <div class="marquee"><div class="marquee-track" id="marquee-a"></div></div>
    <div class="marquee"><div class="marquee-track reverse" id="marquee-b"></div></div>
  </section>

  <!-- ======== scroll-driven reveal ======== -->
  <section class="reveal-section" id="reveal-section">
    <p class="reveal-text" id="reveal-text"></p>
  </section>

  <!-- ======== big stats ======== -->
  <section class="stats-section" id="stats-section">
    <h2 class="stats-heading" data-i18n="stats_heading"></h2>
    <div class="stats" id="stats"></div>
  </section>

  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 data-i18n="form_title"></h2>
        <button id="close-add" class="btn ghost" data-i18n="close"></button>
      </div>
      <p class="muted" data-i18n="form_sub"></p>

      <div class="form-grid">
        <label class="field"><span data-i18n="f_sku"></span> *<input id="f-sku" type="text" placeholder="PB-200"></label>
        <label class="field"><span data-i18n="f_name"></span> *<input id="f-name" type="text"></label>
        <label class="field"><span data-i18n="f_cat"></span>
          <select id="f-cat">
            <option value="consumer_electronics">consumer_electronics</option>
            <option value="apparel">apparel</option>
          </select></label>
        <div class="field spans2">
          <span data-i18n="f_mkts"></span>
          <div class="checks">
            <label class="check"><input id="f-eu" type="checkbox" checked><span data-i18n="f_eu"></span></label>
            <label class="check"><input id="f-uk" type="checkbox"><span data-i18n="f_uk"></span></label>
            <label class="check"><input id="f-us" type="checkbox"><span data-i18n="f_us"></span></label>
          </div>
        </div>

        <label class="field"><span data-i18n="f_mfr"></span><input id="f-mfr" type="text"></label>
        <label class="field"><span data-i18n="f_mfr_country"></span><input id="f-mfr-country" type="text" placeholder="CN"></label>
        <label class="field"><span data-i18n="f_mfr_eu"></span>
          <select id="f-mfr-eu">
            <option value="no" data-i18n="opt_no"></option>
            <option value="yes" data-i18n="opt_yes"></option>
            <option value="unknown" data-i18n="opt_unknown"></option>
          </select></label>

        <div class="field spans2"><span data-i18n="f_feats"></span>
          <div class="checks">
            <label class="check"><input id="f-wireless" type="checkbox"><span data-i18n="f_wireless"></span></label>
          </div>
        </div>

        <div class="field spans2"><span data-i18n="f_battery"></span>
          <div class="checks">
            <label class="check"><input id="f-battery" type="checkbox" checked><span data-i18n="f_has_battery"></span></label>
          </div>
          <div class="row3" id="battery-details">
            <label class="field"><span data-i18n="f_mah"></span><input id="f-mah" type="number" value="10000"></label>
            <label class="field"><span data-i18n="f_volt"></span><input id="f-volt" type="number" step="0.1" value="3.7"></label>
            <label class="field"><span data-i18n="f_wh"></span><input id="f-wh" type="number" value="37"></label>
          </div>
        </div>

        <div class="field spans2"><span data-i18n="f_marks"></span>
          <div class="checks">
            <label class="check"><input id="f-retail" type="checkbox" checked><span data-i18n="f_retail"></span></label>
            <label class="check"><input id="f-trace" type="checkbox" checked><span data-i18n="f_trace"></span></label>
            <label class="check"><input id="f-triman" type="checkbox"><span data-i18n="f_triman"></span></label>
            <label class="check"><input id="f-prop65" type="checkbox"><span data-i18n="f_prop65"></span></label>
          </div>
        </div>

        <div class="field spans2"><span data-i18n="f_docs"></span>
          <div class="checks wrap">
            <label class="check"><input id="f-doc-rpa" type="checkbox"><span data-i18n="d_rpa"></span></label>
            <label class="check"><input id="f-doc-safety" type="checkbox"><span data-i18n="d_safety"></span></label>
            <label class="check"><input id="f-doc-techdoc" type="checkbox"><span data-i18n="d_techdoc"></span></label>
            <label class="check"><input id="f-doc-batdec" type="checkbox"><span data-i18n="d_batdec"></span></label>
            <label class="check"><input id="f-doc-un383" type="checkbox"><span data-i18n="d_un383"></span></label>
            <label class="check"><input id="f-doc-red" type="checkbox"><span data-i18n="d_red"></span></label>
            <label class="check"><input id="f-doc-fcc" type="checkbox"><span data-i18n="d_fcc"></span></label>
          </div>
          <p class="hintline" data-i18n="f_docs_hint"></p>
        </div>

        <div class="field spans2"><span data-i18n="f_regs"></span>
          <div class="row3">
            <label class="field"><span>LUCID（DE 包装）</span><input id="f-reg-lucid" type="text"></label>
            <label class="field"><span>WEEE（DE）</span><input id="f-reg-weee" type="text"></label>
            <label class="field"><span>BattG（DE 电池）</span><input id="f-reg-battg" type="text"></label>
            <label class="field"><span>IDU 包装（FR）</span><input id="f-reg-frpack" type="text"></label>
            <label class="field"><span>IDU WEEE（FR）</span><input id="f-reg-frweee" type="text"></label>
            <label class="field"><span>IDU 电池（FR）</span><input id="f-reg-frbat" type="text"></label>
            <label class="field"><span>UK WEEE 注册</span><input id="f-reg-gbweee" type="text"></label>
            <label class="field"><span>UK 包装 EPR</span><input id="f-reg-gbpack" type="text"></label>
            <label class="field"><span>UK 电池注册</span><input id="f-reg-gbbat" type="text"></label>
          </div>
          <p class="hintline" data-i18n="f_regs_hint"></p>
        </div>

        <div class="field spans2"><span data-i18n="f_channel"></span>
          <div class="checks">
            <label class="check"><input id="f-ch-de" type="checkbox"><span data-i18n="f_chde"></span></label>
            <label class="check"><input id="f-ch-us" type="checkbox"><span data-i18n="f_chus"></span></label>
          </div>
        </div>
      </div>

      <div id="form-error" class="form-error hidden"></div>
      <div class="modal-foot">
        <button id="submit-add" class="btn primary" data-i18n="form_submit"></button>
      </div>
    </div>
  </div>

  <section class="card" id="map-section">
    <div class="card-head">
      <div>
        <h2 data-i18n="map_title"></h2>
        <p class="muted" data-i18n="map_sub"></p>
      </div>
      <div>
        <button id="add-btn" class="btn ghost"><span data-i18n="add_btn"></span></button>
        <button id="impact-btn" class="btn ghost" data-i18n="impact_btn"></button>
      </div>
    </div>
    <div class="disclaimer">
      <span class="dis-icon">§</span>
      <span data-i18n="disclaimer"></span>
    </div>
    <div class="table-scroll">
      <table class="map" id="map">
        <thead><tr id="map-head"></tr></thead>
        <tbody id="map-body"></tbody>
      </table>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="detail" class="card hidden">
    <div class="card-head">
      <div>
        <h2 id="detail-title"></h2>
        <p class="muted" id="detail-sub"></p>
      </div>
      <button id="close-detail" class="btn ghost" data-i18n="close"></button>
    </div>
    <div class="summary" id="detail-summary"></div>
    <div id="detail-blockers"></div>
    <div class="table-scroll">
      <table class="rules">
        <thead>
          <tr>
            <th style="width:34%" data-i18n="th_rule"></th>
            <th data-i18n="th_status"></th>
            <th data-i18n="th_detail"></th>
            <th style="width:22%" data-i18n="th_source"></th>
          </tr>
        </thead>
        <tbody id="detail-rules"></tbody>
      </table>
    </div>
    <div class="advise-row">
      <button id="advise-btn" class="btn primary">🧭 <span data-i18n="advise_btn"></span></button>
      <button id="recommend-btn" class="btn ghost">🌍 <span data-i18n="recommend_btn"></span></button>
    </div>
    <p class="receipt"><span data-i18n="receipt_label"></span> <code id="detail-receipt"></code></p>
    <div id="advise-result" class="hidden"></div>
  </section>

  <section id="recommend" class="card hidden">
    <div class="card-head">
      <div>
        <h2 data-i18n="recommend_title"></h2>
        <p class="muted" data-i18n="recommend_sub"></p>
      </div>
      <button id="close-recommend" class="btn ghost" data-i18n="close"></button>
    </div>
    <div id="recommend-list" class="recommend-list"></div>
  </section>

  <section id="impact" class="card hidden">
    <div class="card-head">
      <div>
        <h2><span data-i18n="impact_title"></span> <span class="chip subtle" data-i18n="impact_chip"></span></h2>
        <p class="muted" data-i18n="impact_sub"></p>
      </div>
      <button id="close-impact" class="btn ghost" data-i18n="close"></button>
    </div>
    <div id="impact-changes" class="impact-changes"></div>
    <div id="impact-skus" class="impact-skus"></div>
  </section>

</main>

</div>
</div>

<footer class="footer" id="footer"></footer>

<div id="chat-drawer" class="chat-drawer hidden">
  <div class="chat-head">
    <div class="chat-title">🤖 <b data-i18n="chat_title"></b></div>
    <div class="chat-progress"><i id="chat-progress-bar" style="width:0%"></i></div>
    <button id="close-chat" class="btn ghost">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-row" id="chat-input-row">
    <input id="chat-input" type="text" autocomplete="off">
    <button id="chat-send" class="btn primary" data-i18n="chat_send"></button>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
